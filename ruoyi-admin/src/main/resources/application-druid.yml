# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
        #        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:sqlserver://192.168.17.131:1433;SelectMethod=cursor;DatabaseName=shopee_brazil
                username: sa
                password: 123

            #                url: jdbc:sqlserver://127.0.0.1:1433;SelectMethod=cursor;DatabaseName=wcs_ruoyi_demo
            #                url: jdbc:sqlserver://192.168.3.50:1433;SelectMethod=cursor;DatabaseName=albs1
            #                username: sa
            #                password: DM123.
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: true
                url: jdbc:sqlserver://192.168.17.133:1433;SelectMethod=cursor;DatabaseName=WJBZ_SCADA_DB
                username: sa
                password: DM123.DM123.
            # 从库数据源
            slave2:
                # 从数据源开关/默认关闭
                enabled: false
                url: jdbc:sqlserver://39.103.220.161:12016;SelectMethod=cursor;DatabaseName=scada_demo
                username: sa
                password: DM123.
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            #            validationQuery: SELECT 1 FROM DUAL
            validationQuery: SELECT 'x'
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: false
                wall:
                    config:
                        multi-statement-allow: true
